<?xml version="1.0" encoding="UTF-8"?>
<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient for background -->
    <linearGradient id="mainGradient192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0FA4AF"/>
      <stop offset="50%" stop-color="#024950"/>
      <stop offset="100%" stop-color="#003135"/>
    </linearGradient>
    
    <!-- Accent gradient for elements -->
    <linearGradient id="accentGradient192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AFDDE5"/>
      <stop offset="100%" stop-color="#0FA4AF"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="96" cy="96" r="88" fill="url(#mainGradient192)" stroke="url(#accentGradient192)" stroke-width="4"/>
  
  <!-- Outer orbit ring -->
  <circle cx="96" cy="96" r="72" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="2" stroke-dasharray="8 12"/>
  
  <!-- Central book/blog element -->
  <g transform="translate(96, 96)">
    <!-- Open book pages -->
    <path d="M-32 -24 L-32 32 L-4 24 L-4 -16 Z" fill="white" opacity="0.9"/>
    <path d="M4 -16 L4 24 L32 32 L32 -24 Z" fill="white" opacity="0.7"/>
    
    <!-- Book spine -->
    <rect x="-4" y="-24" width="8" height="56" fill="url(#accentGradient192)"/>
    
    <!-- Content lines on left page -->
    <line x1="-28" y1="-8" x2="-8" y2="-8" stroke="url(#mainGradient192)" stroke-width="2" opacity="0.6"/>
    <line x1="-28" y1="0" x2="-8" y2="0" stroke="url(#mainGradient192)" stroke-width="2" opacity="0.6"/>
    <line x1="-28" y1="8" x2="-8" y2="8" stroke="url(#mainGradient192)" stroke-width="2" opacity="0.6"/>
    <line x1="-28" y1="16" x2="-8" y2="16" stroke="url(#mainGradient192)" stroke-width="2" opacity="0.6"/>
    
    <!-- Content lines on right page -->
    <line x1="8" y1="-8" x2="28" y2="-8" stroke="url(#mainGradient192)" stroke-width="2" opacity="0.6"/>
    <line x1="8" y1="0" x2="28" y2="0" stroke="url(#mainGradient192)" stroke-width="2" opacity="0.6"/>
    <line x1="8" y1="8" x2="28" y2="8" stroke="url(#mainGradient192)" stroke-width="2" opacity="0.6"/>
    <line x1="8" y1="16" x2="28" y2="16" stroke="url(#mainGradient192)" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Floating particles/stars representing "verse" -->
  <circle cx="48" cy="48" r="4" fill="url(#accentGradient192)" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="144" cy="48" r="3" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="120" r="5" fill="url(#accentGradient192)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="140" r="2.5" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connection lines representing network/universe -->
  <path d="M48 48 Q80 32 144 48" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="2"/>
  <path d="M144 48 Q160 80 152 120" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="2"/>
  <path d="M152 120 Q100 140 40 140" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="2"/>
  <path d="M40 140 Q32 92 48 48" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="2"/>
  
  <!-- Central glow effect -->
  <circle cx="96" cy="96" r="12" fill="none" stroke="url(#accentGradient192)" stroke-width="2" opacity="0.4" filter="url(#glow192)">
    <animate attributeName="r" values="12;20;12" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
