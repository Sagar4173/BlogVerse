<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0FA4AF"/>
      <stop offset="100%" stop-color="#024950"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="8" cy="8" r="7.5" fill="url(#faviconGradient)"/>
  
  <!-- Minimalist book icon -->
  <g transform="translate(8, 8)">
    <!-- Left page -->
    <path d="M-3 -2 L-3 3 L-0.5 2 L-0.5 -1 Z" fill="white"/>
    <!-- Right page -->
    <path d="M0.5 -1 L0.5 2 L3 3 L3 -2 Z" fill="white" opacity="0.8"/>
    <!-- Spine -->
    <rect x="-0.5" y="-2" width="1" height="5" fill="#AFDDE5"/>
  </g>
</svg>
