<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient for background -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0FA4AF"/>
      <stop offset="50%" stop-color="#024950"/>
      <stop offset="100%" stop-color="#003135"/>
    </linearGradient>
    
    <!-- Accent gradient for elements -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AFDDE5"/>
      <stop offset="100%" stop-color="#0FA4AF"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="24" cy="24" r="22" fill="url(#mainGradient)" stroke="url(#accentGradient)" stroke-width="1"/>
  
  <!-- Outer orbit ring -->
  <circle cx="24" cy="24" r="18" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="1" stroke-dasharray="2 3"/>
  
  <!-- Central book/blog element -->
  <g transform="translate(24, 24)">
    <!-- Open book pages -->
    <path d="M-8 -6 L-8 8 L-1 6 L-1 -4 Z" fill="white" opacity="0.9"/>
    <path d="M1 -4 L1 6 L8 8 L8 -6 Z" fill="white" opacity="0.7"/>
    
    <!-- Book spine -->
    <rect x="-1" y="-6" width="2" height="14" fill="url(#accentGradient)"/>
    
    <!-- Content lines on left page -->
    <line x1="-7" y1="-2" x2="-2" y2="-2" stroke="url(#mainGradient)" stroke-width="0.5" opacity="0.6"/>
    <line x1="-7" y1="0" x2="-2" y2="0" stroke="url(#mainGradient)" stroke-width="0.5" opacity="0.6"/>
    <line x1="-7" y1="2" x2="-2" y2="2" stroke="url(#mainGradient)" stroke-width="0.5" opacity="0.6"/>
    
    <!-- Content lines on right page -->
    <line x1="2" y1="-2" x2="7" y2="-2" stroke="url(#mainGradient)" stroke-width="0.5" opacity="0.6"/>
    <line x1="2" y1="0" x2="7" y2="0" stroke="url(#mainGradient)" stroke-width="0.5" opacity="0.6"/>
    <line x1="2" y1="2" x2="7" y2="2" stroke="url(#mainGradient)" stroke-width="0.5" opacity="0.6"/>
  </g>
  
  <!-- Floating particles/stars representing "verse" -->
  <circle cx="12" cy="12" r="1" fill="url(#accentGradient)" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="36" cy="12" r="0.8" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="38" cy="30" r="1.2" fill="url(#accentGradient)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="10" cy="35" r="0.6" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connection lines representing network/universe -->
  <path d="M12 12 Q20 8 36 12" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="0.5"/>
  <path d="M36 12 Q40 20 38 30" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="0.5"/>
  <path d="M38 30 Q25 35 10 35" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="0.5"/>
  <path d="M10 35 Q8 23 12 12" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="0.5"/>
  
  <!-- Central glow effect -->
  <circle cx="24" cy="24" r="3" fill="none" stroke="url(#accentGradient)" stroke-width="0.5" opacity="0.4" filter="url(#glow)">
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg> 