<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient for background -->
    <linearGradient id="mainGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0FA4AF"/>
      <stop offset="25%" stop-color="#0FA4AF"/>
      <stop offset="50%" stop-color="#024950"/>
      <stop offset="75%" stop-color="#024950"/>
      <stop offset="100%" stop-color="#003135"/>
    </linearGradient>
    
    <!-- Accent gradient for elements -->
    <linearGradient id="accentGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AFDDE5"/>
      <stop offset="50%" stop-color="#0FA4AF"/>
      <stop offset="100%" stop-color="#024950"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow effect -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(2, 73, 80, 0.3)"/>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#mainGradient512)" stroke="url(#accentGradient512)" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Multiple orbit rings for depth -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(175, 221, 229, 0.2)" stroke-width="3" stroke-dasharray="20 30"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(175, 221, 229, 0.15)" stroke-width="2" stroke-dasharray="15 25"/>
  
  <!-- Central book/blog element -->
  <g transform="translate(256, 256)">
    <!-- Open book pages with shadow -->
    <path d="M-80 -60 L-80 80 L-10 60 L-10 -40 Z" fill="white" opacity="0.95" filter="url(#shadow)"/>
    <path d="M10 -40 L10 60 L80 80 L80 -60 Z" fill="white" opacity="0.8" filter="url(#shadow)"/>
    
    <!-- Book spine with gradient -->
    <rect x="-10" y="-60" width="20" height="140" fill="url(#accentGradient512)"/>
    
    <!-- Content lines on left page -->
    <line x1="-70" y1="-20" x2="-20" y2="-20" stroke="url(#mainGradient512)" stroke-width="3" opacity="0.7"/>
    <line x1="-70" y1="-5" x2="-20" y2="-5" stroke="url(#mainGradient512)" stroke-width="3" opacity="0.7"/>
    <line x1="-70" y1="10" x2="-20" y2="10" stroke="url(#mainGradient512)" stroke-width="3" opacity="0.7"/>
    <line x1="-70" y1="25" x2="-20" y2="25" stroke="url(#mainGradient512)" stroke-width="3" opacity="0.7"/>
    <line x1="-70" y1="40" x2="-20" y2="40" stroke="url(#mainGradient512)" stroke-width="3" opacity="0.7"/>
    
    <!-- Content lines on right page -->
    <line x1="20" y1="-20" x2="70" y2="-20" stroke="url(#mainGradient512)" stroke-width="3" opacity="0.7"/>
    <line x1="20" y1="-5" x2="70" y2="-5" stroke="url(#mainGradient512)" stroke-width="3" opacity="0.7"/>
    <line x1="20" y1="10" x2="70" y2="10" stroke="url(#mainGradient512)" stroke-width="3" opacity="0.7"/>
    <line x1="20" y1="25" x2="70" y2="25" stroke="url(#mainGradient512)" stroke-width="3" opacity="0.7"/>
    <line x1="20" y1="40" x2="70" y2="40" stroke="url(#mainGradient512)" stroke-width="3" opacity="0.7"/>
    
    <!-- Additional details - bookmarks -->
    <rect x="-5" y="-60" width="3" height="30" fill="#AFDDE5"/>
    <rect x="2" y="-60" width="3" height="35" fill="rgba(175, 221, 229, 0.8)"/>
  </g>
  
  <!-- Floating particles/stars representing "verse" -->
  <circle cx="120" cy="120" r="8" fill="url(#accentGradient512)" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="392" cy="120" r="6" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="412" cy="320" r="10" fill="url(#accentGradient512)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="380" r="5" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="200" r="4" fill="url(#accentGradient512)" opacity="0.6">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="190" r="3" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connection lines representing network/universe -->
  <path d="M120 120 Q200 80 392 120" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="3"/>
  <path d="M392 120 Q440 200 412 320" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="3"/>
  <path d="M412 320 Q280 380 100 380" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="3"/>
  <path d="M100 380 Q60 250 120 120" fill="none" stroke="rgba(175, 221, 229, 0.3)" stroke-width="3"/>
  <path d="M80 200 Q180 160 430 190" fill="none" stroke="rgba(175, 221, 229, 0.2)" stroke-width="2"/>
  
  <!-- Central glow effect -->
  <circle cx="256" cy="256" r="30" fill="none" stroke="url(#accentGradient512)" stroke-width="4" opacity="0.4" filter="url(#glow512)">
    <animate attributeName="r" values="30;50;30" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Subtle pattern overlay -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="rgba(175, 221, 229, 0.1)" stroke-width="1" stroke-dasharray="5 10"/>
</svg>
